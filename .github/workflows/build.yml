name: Build Pulse Jailbreak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        brew install ldid xz

    - name: Build Dopamine with Pulse UI
      run: |
        cd Application/Dopamine
        make clean
        make package FINALPACKAGE=1

    - name: Upload TIPA
      uses: actions/upload-artifact@v3
      with:
        name: Pulse-Jailbreak-TIPA
        path: Application/Dopamine/packages/*.tipa
